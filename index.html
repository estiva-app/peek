<!doctype html>
<html lang="en" class="dark signal">
  <head>
    <meta charset="UTF-8" />
    <!-- 💬 from Noto Emoji (Google, github.com/googlefonts/noto-emoji, open licence); Ship is 🚢, Leaf 🥬 (SFX-1).
         The PNG is for Safari, which ignores an SVG tab icon; other browsers take the SVG, the last one listed. -->
    <link rel="icon" href="/favicon-32.png?v=7" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg?v=7" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peek</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The saved picture of Desk or Topics (src/lib/pagePicture.ts): shown the moment the page arrives, before the app
      has loaded, and replaced in place by the live page once it has drawn (Miky, 13 Oct). Only for the person whose
      copy this device holds, on a plain /app/desk or /app/folders, and only when the stylesheet is the one the picture
      was drawn with. Inline, so it costs no request; keep it in step with pagePicture.ts.
    -->
    <script>
      ;(function () {
        try {
          var path = location.pathname
          if (location.search) return
          var page = path === '/' || path === '/app' || path === '/app/desk' ? 'desk' : path === '/app/folders' ? 'topics' : null
          if (!page) return
          var session = JSON.parse(localStorage.getItem('peek.estivaId.token') || 'null')
          var picture = JSON.parse(localStorage.getItem('peek-' + page + '-picture') || 'null')
          if (!session || !session.pubkey || !picture || typeof picture.owner !== 'string') return
          // The copy's owner (`<relay>|<pubkey>`), and the person this session is for.
          if (picture.owner !== localStorage.getItem('peek-device-copy-owner')) return
          if (picture.owner.slice(picture.owner.lastIndexOf('|') + 1) !== session.pubkey) return
          var css = document.querySelector('link[rel="stylesheet"][href*="/assets/"]')
          if (!css || css.getAttribute('href') !== picture.css) return
          var cover = document.createElement('div')
          cover.id = 'peek-picture'
          cover.setAttribute('aria-hidden', 'true')
          cover.style.cssText = 'position:fixed;inset:0;z-index:2147483647;overflow:hidden;isolation:isolate;background:var(--bg-base)'
          var content = document.createElement('div')
          content.inert = true
          content.style.minHeight = '100vh'
          content.innerHTML = picture.html
          cover.appendChild(content)
          // A click on the picture is applied to the live page once it is there, if the same row is under it.
          cover.addEventListener('click', function (event) {
            window.__peekPicture.click = { x: event.clientX, y: event.clientY }
          })
          var root = document.getElementById('root')
          root.parentNode.insertBefore(cover, root)
          window.__peekPicture = { shownAt: Math.round(performance.now()), page: page }
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
