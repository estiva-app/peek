name: Install
description: Node 24 and node_modules, restored whole from the cache when the lockfile has not changed.

# `npm ci` cost 9–26 s in each of the workflow's jobs, even with setup-node's npm
# cache, and it is on every job's critical path (PER-15). This restores the
# finished node_modules instead, and runs `npm ci` only when there is none.
#
# The key is exact on purpose, and there are no restore-keys: a node_modules
# restored from a *different* lockfile is a stale tree that passes or fails for
# reasons that are not in the commit. Node's version is in it because native
# modules are built for one ABI. package.json is in it as well as the lockfile:
# on a hit `npm ci` does not run, and `npm ci` is what refuses a package.json
# that has drifted from its lockfile, so that change has to miss.
#
# Saved straight after the install, not in a post step at the end of the job,
# so what the tests, the build or the linters write under node_modules/.cache
# or .vite never goes into it. On a miss every parallel job installs, and the
# first to finish saves; the others' saves are refused with a warning.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      id: node
      with:
        node-version: 24

    - uses: actions/cache/restore@v4
      id: cache
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json') }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: ${{ steps.cache.outputs.cache-primary-key }}
