name: deploy

# Push to main → image on GHCR. The box pulls the image within two minutes.
#
# No SSH, no DEPLOY_SSH_KEY, no DEPLOY_HOST. The Hetzner firewall allows TCP 22
# from the home IP only, and a deploy key in GitHub would be a standing
# credential for a path that is deliberately closed. See PEEK-54 and PEEK-76.

on:
  push:
    branches: [main]
  pull_request:
  # GitHub sometimes never delivers the push: e9c57da (PEE-38, 2026-09-29)
  # merged, no run was ever created, and there was nothing to re-run.
  # `gh workflow run deploy.yml -R estiva-app/peek --ref main` deploys main as
  # it stands; from any other ref it only checks, like a pull request.
  workflow_dispatch:

concurrency:
  group: deploy-peek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The typechecks and the tests used to be one job, `check`, and the tests
  # were 85% of it: ~290 s of a ~350 s job on every run (PER-7). They are
  # separate jobs now, so the critical path is the slowest one, not the sum.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfile is unchanged
      # (PER-15). estiva-foundation's action since PER-16, shared with Ship.
      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1

      # `npm run lint` is deliberately not a gate: it currently reports 79
      # pre-existing errors (mostly react-refresh/only-export-components), so
      # wiring it here would block every deploy on a backlog this ticket did not
      # sign up to clear. Worth fixing separately; not worth blocking on.

      # The build's typecheck, run on the PR too: until it ran here, the app's
      # build happened only inside `publish`, so a PR could be green while
      # `main`'s deploy was broken (#182). There was a second one, `tsc -p
      # convex`, until REM-7 deleted `convex/`.
      - name: Typecheck the app
        run: npx tsc -b

  # Sharded by file, because a private repository's runner has 2 vCPUs and
  # Vitest leaves one for itself: the suite ran on a single worker, one file at
  # a time, and ~40% of its time was setting up jsdom for each file. Four
  # runners run four files at once. Every shard must pass; `fail-fast` is off so
  # a failure in one shard still reports what the others found.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfile is unchanged
      # (PER-15). estiva-foundation's action since PER-16, shared with Ship.
      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1

      - name: Test (shard ${{ matrix.shard }} of 4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # The UI Guardrails' rules, on their own (UIG-3): a raw element the package
  # already has fails here, with a message naming the component. `npm run
  # lint:rules` also writes .gates-count.json and fails on an eslint-disable
  # that switches one of these rules off. Zero errors on the day this landed, so
  # it stays zero.
  #
  # A job of its own, not a step in `check`, because GitHub can require only a
  # whole job, by its name (UIG-6): branch protection on main requires `gate`.
  # Renaming this job leaves every pull request waiting for a check that never
  # reports.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfile is unchanged
      # (PER-15). estiva-foundation's action since PER-16, shared with Ship.
      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1

      # Every step of the gate, as one command from the package (estiva-ui
      # 0.36.0, Katerina's ruling R13): the gate lint and `.gates-count.json`,
      # which must be committed; the token rules (`npm run lint:tokens`, which
      # catch a class that compiles to nothing — the transparent sign-in screen
      # in Ship, the unfilled card in Peek's Folder panel); the catalogue
      # (every part described, every usage page kept); and the wall's own
      # settings: the editor hook refuses a raw button, and every folder the
      # gate skips is named on docs/GATES-DEBT.md.
      - name: The gate (estiva-gates ci)
        run: npx estiva-gates ci

  publish:
    # `gate` too: the rules stopped a deploy while they were a step in `check`,
    # and moving them into a job of their own must not change that.
    needs: [typecheck, test, gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfile is unchanged
      # (PER-15). estiva-foundation's action since PER-16, shared with Ship.
      - uses: estiva-app/estiva-foundation/.github/actions/install@ci-v1

      # Runs before the image build because the image is only an envelope for
      # dist/.
      #
      # The relay origin is a build-time value since REM-2, and this is where it
      # is set; without it the bundle is in mock mode. Not a secret: every
      # published event names it. Until REM-7 this step was `npx convex deploy
      # --cmd 'npm run build'`, which also pushed the Convex backend and set
      # VITE_CONVEX_URL.
      - name: Build the frontend
        run: npm run build
        env:
          VITE_RELAY_URL: https://estiva.estiva.app

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
