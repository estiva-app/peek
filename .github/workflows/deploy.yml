name: deploy

# Push to main → Convex backend deployed, image on GHCR. The box pulls the
# image within two minutes.
#
# No SSH, no DEPLOY_SSH_KEY, no DEPLOY_HOST. The Hetzner firewall allows TCP 22
# from the home IP only, and a deploy key in GitHub would be a standing
# credential for a path that is deliberately closed. See PEEK-54 and PEEK-76.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-peek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The typechecks and the tests used to be one job, `check`, and the tests
  # were 85% of it: ~290 s of a ~350 s job on every run (PER-7). They are
  # separate jobs now, so the critical path is the slowest one, not the sum.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfile is unchanged
      # (PER-15). estiva-foundation's action since PER-16, shared with Ship.
      - uses: estiva-app/estiva-foundation/.github/actions/install@d4bfce573e813925d00f63be087555ea3dc76596

      # `npm run lint` is deliberately not a gate: it currently reports 79
      # pre-existing errors (mostly react-refresh/only-export-components), so
      # wiring it here would block every deploy on a backlog this ticket did not
      # sign up to clear. Worth fixing separately; not worth blocking on.

      # Both typechecks, because there are two and they disagree.
      #
      # `tsc -b` is the app's (`lib: ES2023`). `tsc -p convex` is the one
      # `convex deploy` runs on the functions, and its `lib` is **ES2021** — so
      # a `.at(-1)` typechecks under the first and fails under the second.
      # Neither ran here until now: the app's build happened only inside
      # `publish`, and the Convex one only inside `convex deploy`. A PR was
      # therefore green while `main`'s deploy was broken, which is exactly what
      # happened to #182 — the deploy failed on one line in a test file that
      # every check on the PR had passed.
      - name: Typecheck the app
        run: npx tsc -b

      - name: Typecheck the Convex functions
        run: npx tsc -p convex

  # Sharded by file, because a private repository's runner has 2 vCPUs and
  # Vitest leaves one for itself: the suite ran on a single worker, one file at
  # a time, and ~40% of its time was setting up jsdom for each file. Four
  # runners run four files at once. Every shard must pass; `fail-fast` is off so
  # a failure in one shard still reports what the others found.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfile is unchanged
      # (PER-15). estiva-foundation's action since PER-16, shared with Ship.
      - uses: estiva-app/estiva-foundation/.github/actions/install@d4bfce573e813925d00f63be087555ea3dc76596

      - name: Test (shard ${{ matrix.shard }} of 4)
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # The UI Guardrails' rules, on their own (UIG-3): a raw element the package
  # already has fails here, with a message naming the component. `npm run
  # lint:rules` also writes .gates-count.json and fails on an eslint-disable
  # that switches one of these rules off. Zero errors on the day this landed, so
  # it stays zero.
  #
  # A job of its own, not a step in `check`, because GitHub can require only a
  # whole job, by its name (UIG-6): branch protection on main requires `gate`.
  # Renaming this job leaves every pull request waiting for a check that never
  # reports.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfile is unchanged
      # (PER-15). estiva-foundation's action since PER-16, shared with Ship.
      - uses: estiva-app/estiva-foundation/.github/actions/install@d4bfce573e813925d00f63be087555ea3dc76596

      - name: Gate lint
        run: npm run lint:rules

      # The token rules are a gate, on their own (2026-09-10). They are the
      # ones that catch a class which compiles to nothing — the defect that
      # shipped a transparent sign-in screen in Ship and an unfilled card in
      # Peek's Folder panel. Zero errors on the day this landed, so it stays
      # zero. In `gate`, the one required check, since UIG-21: in `check` a
      # token error stopped the deploy but not the merge.
      - name: Token lint
        run: npm run lint:tokens

      # Every part says in one line what it is for, so `npm run ui:find` can offer
      # it before someone builds it again (UIG-13). Built from the code; nothing kept.
      - name: Every part is described
        run: npm run registry:check

  publish:
    # `gate` too: the rules stopped a deploy while they were a step in `check`,
    # and moving them into a job of their own must not change that.
    needs: [typecheck, test, gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Node and node_modules, from the cache when the lockfile is unchanged
      # (PER-15). estiva-foundation's action since PER-16, shared with Ship.
      - uses: estiva-app/estiva-foundation/.github/actions/install@d4bfce573e813925d00f63be087555ea3dc76596

      # Pushes the Convex backend *and* injects the matching VITE_CONVEX_URL
      # into the frontend build, in one step, so the two halves cannot drift.
      # This is what removes the old "backend changes additionally need
      # `npx convex deploy`" footgun — nobody has to remember.
      #
      # It runs before the image build because the image is only an envelope for
      # dist/; building without this produces a bundle pointed at nothing.
      #
      # The relay origin is a build-time value since REM-2, and this is where it
      # is set. It used to be read at runtime from the deployment's
      # NOSTR_RELAY_URL through `nostr.config.relayConfig`, which made a Convex
      # outage a relay outage. Not a secret: every published event names it.
      - name: Deploy Convex backend and build frontend
        run: npx convex deploy --cmd 'npm run build'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_RELAY_URL: https://estiva.estiva.app

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
