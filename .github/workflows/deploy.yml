name: deploy

# Push to main → Convex backend deployed, image on GHCR. The box pulls the
# image within two minutes.
#
# No SSH, no DEPLOY_SSH_KEY, no DEPLOY_HOST. The Hetzner firewall allows TCP 22
# from the home IP only, and a deploy key in GitHub would be a standing
# credential for a path that is deliberately closed. See PEEK-54 and PEEK-76.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-peek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `npm run lint` is deliberately not a gate: it currently reports 79
      # pre-existing errors (mostly react-refresh/only-export-components), so
      # wiring it here would block every deploy on a backlog this ticket did not
      # sign up to clear. Worth fixing separately; not worth blocking on.
      #
      # The token rules are a gate, on their own (D55, 2026-09-10). They are the
      # ones that catch a class which compiles to nothing — the defect that
      # shipped a transparent sign-in screen in Ship and an unfilled card in
      # Peek's Folder panel. Zero errors on the day this landed, so it stays
      # zero.
      - name: Token lint
        run: npm run lint:tokens

      - name: Test
        run: npm run test:run

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pushes the Convex backend *and* injects the matching VITE_CONVEX_URL
      # into the frontend build, in one step, so the two halves cannot drift.
      # This is what removes the "backend changes additionally need
      # `npx convex deploy`" footgun from HOW-TO-RUN.md — nobody has to remember.
      #
      # It runs before the image build because the image is only an envelope for
      # dist/; building without this produces a bundle pointed at nothing.
      - name: Deploy Convex backend and build frontend
        run: npx convex deploy --cmd 'npm run build'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
