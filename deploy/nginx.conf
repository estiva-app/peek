# Estiva Peek, served at the root of peek.estiva.app.
#
# TLS, compression and edge caching are Cloudflare's job — this server sees
# plain HTTP from `cloudflared` on the loopback.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client addresses do not survive the tunnel (PEEK-86); the log records the
    # Docker bridge gateway for every request. Do not build anything on it.
    access_log /var/log/nginx/access.log;

    # Vite fingerprints these, so the filename changes whenever the content
    # does. Safe to cache hard, and worth it — they are the bulk of the payload.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A real SPA, unlike Ship's hash router: routes are server paths, so an
    # unmatched path must reach index.html rather than 404. Ordered after
    # /assets/ deliberately — a missing hashed asset should 404 loudly, not
    # return HTML that the browser then fails to parse as JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html keeps its name across deploys, so caching it pins users to the
    # old asset hashes and the deploy appears not to have happened.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
